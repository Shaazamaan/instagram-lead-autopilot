  <g stroke="#8b87c9" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <path d="M280 175H336"/><path d="M580 175H636"/><path d="M880 175H936"/>
    <path d="M760 250V326"/><path d="M1050 250V326H884"/>
