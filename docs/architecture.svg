<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#8b87c9"/></marker>
    <linearGradient id="ig" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fa7e1e"/><stop offset="0.5" stop-color="#d62976"/><stop offset="1" stop-color="#4f5bd5"/></linearGradient>
  </defs>
  <rect width="1200" height="560" rx="24" fill="#14122b"/>
  <text x="600" y="50" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">How it works</text>
  <g font-size="15" fill="#e8e6ff">
    <rect x="40" y="100" width="240" height="150" rx="16" fill="#1f1c40" stroke="#5b56a8"/>
    <text x="160" y="132" text-anchor="middle" font-weight="700" font-size="18" fill="#fff">Claude writer</text>
    <text x="160" y="162" text-anchor="middle">Scheduled task, every 4 h</text>
    <text x="160" y="186" text-anchor="middle">Scripts from verified facts</text>
    <text x="160" y="210" text-anchor="middle">Tuned by audience insights</text>
    <rect x="340" y="100" width="240" height="150" rx="16" fill="#1f1c40" stroke="#5b56a8"/>
    <text x="460" y="132" text-anchor="middle" font-weight="700" font-size="18" fill="#fff">Factory</text>
    <text x="460" y="162" text-anchor="middle">GitHub Actions, 2x daily</text>
    <text x="460" y="186" text-anchor="middle">Blender 3D reels + TTS voice</text>
    <text x="460" y="210" text-anchor="middle">Carousels, posters, stories</text>
    <rect x="640" y="100" width="240" height="150" rx="16" fill="#1f1c40" stroke="#5b56a8"/>
    <text x="760" y="132" text-anchor="middle" font-weight="700" font-size="18" fill="#fff">GitHub Pages</text>
    <text x="760" y="162" text-anchor="middle">manifest.json + media/</text>
    <text x="760" y="186" text-anchor="middle">Unique keyword per post</text>
    <text x="760" y="210" text-anchor="middle">2-week stock buffer</text>
    <rect x="940" y="100" width="220" height="150" rx="16" fill="url(#ig)"/>
    <text x="1050" y="140" text-anchor="middle" font-weight="800" font-size="20" fill="#fff">Instagram</text>
    <text x="1050" y="170" text-anchor="middle" fill="#fff">Up to ~45 posts / day</text>
    <text x="1050" y="194" text-anchor="middle" fill="#fff">Staged ramp-up</text>
    <rect x="340" y="330" width="540" height="170" rx="16" fill="#1f1c40" stroke="#d62976" stroke-width="2"/>
    <text x="610" y="364" text-anchor="middle" font-weight="700" font-size="18" fill="#fff">Cloudflare Worker autopilot (cron every minute)</text>
    <text x="610" y="396" text-anchor="middle">Posts on schedule · Comment keyword → private DM + public reply</text>
    <text x="610" y="422" text-anchor="middle">Follow gate · Qualifying chat (Workers AI) · Check-ins at 2h / 9h / 22h</text>
    <text x="610" y="448" text-anchor="middle">Daily insights · Privacy &amp; data-deletion pages · "delete" erases data</text>
    <rect x="940" y="370" width="220" height="100" rx="16" fill="#1f1c40" stroke="#5865f2" stroke-width="2"/>
    <text x="1050" y="408" text-anchor="middle" font-weight="700" font-size="18" fill="#fff">Discord</text>
    <text x="1050" y="436" text-anchor="middle">Lead alert → owner calls</text>
    <rect x="40" y="370" width="240" height="100" rx="16" fill="#1f1c40" stroke="#5b56a8"/>
    <text x="160" y="408" text-anchor="middle" font-weight="700" font-size="18" fill="#fff">Claude monitor</text>
    <text x="160" y="436" text-anchor="middle">Every 3-6 h, fixes failures</text>
